<script>
  (function () {
    var stage = document.getElementById("playStage");
    var frame = document.getElementById("gameFrame");
    var stageTitle = document.getElementById("stageTitle");
    var back = document.getElementById("backToList");

    function open(src, title) {
      stageTitle.textContent = title || "";
      frame.src = src;
      stage.classList.add("open");
      stage.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      document.body.classList.add("playing");
      // 侧栏的汉堡按钮层级高于舞台，会压在舞台顶栏上；游戏期间先收起来
      var toggle = document.querySelector(".navbar-toggle");
      if (toggle) toggle.style.display = "none";
    }
    function close() {
      stage.classList.remove("open");
      stage.setAttribute("aria-hidden", "true");
      frame.src = "about:blank";
      document.body.style.overflow = "";
      document.body.classList.remove("playing");
      var toggle = document.querySelector(".navbar-toggle");
      if (toggle) toggle.style.display = "";
    }

    Array.prototype.forEach.call(document.querySelectorAll(".play-page .card[data-src]"), function (card) {
      card.addEventListener("click", function () {
        open(card.getAttribute("data-src"), card.getAttribute("data-title"));
      });
    });
    back.addEventListener("click", close);
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && stage.classList.contains("open")) close();
    });

    var q = new URLSearchParams(location.search).get("g");
    if (q) {
      var card = document.querySelector('.play-page .card[data-src*="' + q + '"]');
      if (card) open(card.getAttribute("data-src"), card.getAttribute("data-title"));
    }
  })();
</script>

<script>
    function viewer_init() {
        let pswpElement = document.querySelectorAll('.pswp')[0];
        let $imgArr = document.querySelectorAll(('.article-entry img:not(.reward-img)'))

        $imgArr.forEach(($em, i) => {
            $em.onclick = () => {
                // slider展开状态
                // todo: 这样不好，后面改成状态
                if (document.querySelector('.left-col.show')) return
                let items = []
                $imgArr.forEach(($em2, i2) => {
                    let img = $em2.getAttribute('data-idx', i2)
                    let src = $em2.getAttribute('data-target') || $em2.getAttribute('src')
                    let title = $em2.getAttribute('alt')
                    // 获得原图尺寸
                    const image = new Image()
                    image.src = src
                    items.push({
                        src: src,
                        w: image.width || $em2.width,
                        h: image.height || $em2.height,
                        title: title
                    })
                })
                var gallery = new PhotoSwipe(pswpElement, PhotoSwipeUI_Default, items, {
                    index: parseInt(i)
                });
                gallery.init()
            }
        })
    }
    viewer_init()

<script>
  function wait(callback, seconds) {
    var timelag = null;
    timelag = window.setTimeout(callback, seconds);
  }
  !function (e, t, a) {
    var initCopyCode = function(){
      var copyHtml = '';
      copyHtml += '<button class="btn-copy" data-clipboard-snippet="">';
      copyHtml += '<i class="ri-file-copy-2-line"></i><span>COPY</span>';
      copyHtml += '</button>';
      $(".highlight .code pre").before(copyHtml);
      $(".article pre code").before(copyHtml);
      var clipboard = new ClipboardJS('.btn-copy', {
        target: function(trigger) {
          return trigger.nextElementSibling;
        }
      });
      clipboard.on('success', function(e) {
        let $btn = $(e.trigger);
        $btn.addClass('copied');
        let $icon = $($btn.find('i'));
        $icon.removeClass('ri-file-copy-2-line');
        $icon.addClass('ri-checkbox-circle-line');
        let $span = $($btn.find('span'));
        $span[0].innerText = 'COPIED';
        
        wait(function () { // 等待两秒钟后恢复
          $icon.removeClass('ri-checkbox-circle-line');
          $icon.addClass('ri-file-copy-2-line');
          $span[0].innerText = 'COPY';
        }, 2000);
      });
      clipboard.on('error', function(e) {
        e.clearSelection();
        let $btn = $(e.trigger);
        $btn.addClass('copy-failed');
        let $icon = $($btn.find('i'));
        $icon.removeClass('ri-file-copy-2-line');
        $icon.addClass('ri-time-line');
        let $span = $($btn.find('span'));
        $span[0].innerText = 'COPY FAILED';
        
        wait(function () { // 等待两秒钟后恢复
          $icon.removeClass('ri-time-line');
          $icon.addClass('ri-file-copy-2-line');
          $span[0].innerText = 'COPY';
        }, 2000);
      });
    }
    initCopyCode();
  }(window, document);
</script>
